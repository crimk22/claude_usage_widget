<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'">
  <title>AI Usage</title>
  <link rel="stylesheet" href="dashboard.css">
</head>
<body class="theme-dark">
  <header class="top">
    <div class="brand"><span class="dot"></span><span data-i18n="app.name"></span></div>
    <nav id="tabs" role="tablist">
      <button role="tab" data-tab="overview" data-i18n="tab.overview"></button>
      <button role="tab" data-tab="projects" data-i18n="tab.projects"></button>
      <button role="tab" data-tab="models" data-i18n="tab.models"></button>
      <button role="tab" data-tab="habits" data-i18n="tab.habits"></button>
      <button role="tab" data-tab="history" data-i18n="tab.history"></button>
      <button role="tab" data-tab="tips" data-i18n="tab.tips"></button>
      <button role="tab" data-tab="settings" data-i18n="tab.settings"></button>
    </nav>
    <label class="profile-pick" id="profilePick">
      <span data-i18n="dash.profile"></span>
      <select id="profileSelect"></select>
    </label>
  </header>
  <main id="pane"><p class="muted" data-i18n="dash.loading"></p></main>
  <footer class="foot" data-i18n="dash.local"></footer>
  <div class="tooltip" id="tooltip" hidden></div>
  <script src="../core/i18n.js"></script>
  <script src="dashboard.js"></script>
</body>
</html>
